workflows:
  ios-app-store:
    name: iOS App Store
    max_build_duration: 120
    instance_type: mac_mini_m2

    # 必须和 Codemagic → Integrations 里 API Key 的名称一致
    integrations:
      app_store_connect: test2

    environment:
      # 使用你在 Code signing identities 里上传的证书 + 描述文件
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.huankecontact.test
      vars:
        BUNDLE_ID: "com.huankecontact.test"
        XCODE_PROJECT: "Toamge2.xcodeproj"
        XCODE_SCHEME: "Toamge2"
        # App Store Connect → App → App 信息 → Apple ID（纯数字）
        APP_STORE_APPLE_ID: 0
      xcode: latest

    scripts:
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles

      - name: Increment build number
        script: |
          set -euo pipefail
          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" || echo 0)
          agvtool new-version -all $((LATEST_BUILD_NUMBER + 1))

      - name: Build ipa for distribution
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
